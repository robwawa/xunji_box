# ============================================================
# 乐普 SLAM 3.0 底盘配置
# 驱动: chassis_interface::LepuDriver
# 协议: AA 54 帧, USB-RS232, 115200 8N1
# 参考: slam_api.txt (官方串口协议文档)
# ============================================================

# --- 桥接节点参数 ---
driver_plugin: "chassis_interface::LepuDriver"
odom_topic: "odom"
cmd_vel_topic: "cmd_vel"
odom_frame: "odom"
base_frame: "base_link"
odom_queue_size: 50
cmd_vel_queue_size: 1
max_linear_speed: 0.2       # m/s 安全限幅
max_angular_speed: 0.6      # rad/s 安全限幅
cmd_vel_timeout: 0.2        # s, 超时自动停止
publish_rate: 50.0          # Hz, odom发布频率
diag_rate: 1.0              # Hz, 诊断发布频率

# --- 里程计协方差 ---
cov_pose_xx: 0.05
cov_pose_yy: 0.05
cov_pose_yawyaw: 0.1
cov_twist_xx: 0.05
cov_twist_yawyaw: 0.05

# --- 乐普驱动专属参数 ---
port: "/dev/lepu_chassis"
baudrate: 115200
enable_pose_report: true         # 开启 nav_pose 自动上报 (§37)
odom_source: "nav_pose"          # 里程计来源: "base_vel"(§9) 或 "nav_pose"(§27)
nav_mode: "mapping"             # 导航模式: "mapping"(建图) "navi"(导航) "remap"(增量建图)
odom_linear_scale: 1.0           # 线速度标定系数
odom_angular_scale: 1.0          # 角速度标定系数
dt_max: 0.5                      # s, 最大有效时间间隔
vel_lpf_alpha: 0.3               # 速度低通滤波系数 (0~1, 越小越平滑, 0.3=中等滤波)
max_vel_change: 0.5              # m/s², 单周期最大线速度变化量(变化率限幅)
max_angular_vel_change: 1.0      # rad/s², 单周期最大角速度变化量(变化率限幅)
reconnect_interval: 1.0          # s, USB断联后通过稳定设备别名重试的间隔
data_timeout: 1.0                # s, 无有效里程计数据时强制重连

# 注: 官方协议 core_data(§4) wheel_status(§5) 均不含编码器
